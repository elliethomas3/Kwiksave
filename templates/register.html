<!DOCTYPE html>
<html lang="en">
<head>
    <title>Kwiksave - Register</title>
    <style>
        h1, .user, .email, .pass, .button, a {
            font-family: "Ebrima";
            display: flex;
            justify-content: center;
            align-items: center;
            align-self: center;
        }

        a {
            color: darksalmon;
            font-family: "Ebrima";
        }

        a:hover {
            color: lightsalmon;
            font-weight: bold;
        }

        h1 {
            color: darksalmon;
        }

    </style>
</head>
<body>
<h1>Create Account</h1>

<form method="POST">

    <div class="user">
        <input type="text" name="username"
           placeholder="Username" required>
        <br><br>
    </div>

    <div class="email">
        <input type="email" name="email"
           placeholder="Email" required>
        <br><br>
    </div>

    <div class="pass">
        <input type="password" name="password"
           placeholder="Password" required>
        <br><br>
    </div>

    <div class="button">
        <br><br>
        <button type="submit">Register</button>
    </div>


</form>

<a href="/login">Already have an account?</a>
</body>
</html>
