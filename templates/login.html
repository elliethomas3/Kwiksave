<!DOCTYPE html>
<html lang="en">
<head>
    <title>Kwiksave - Login</title>
    <style>
        h1, h2, .email, .pass, .button, a {
            font-family: "Ebrima";
            display: flex;
            justify-content: center;
            align-items: center;
            align-self: center;
        }

        a {
            color: darksalmon;
            font-family: "Ebrima";
        }

        a:hover {
            color: lightsalmon;
            font-weight: bold;
        }

        h1 {
            color: darksalmon;
        }

    </style>
</head>
<body>
<h1>Kwiksave</h1>

<h2>Login</h2>

<form method="POST">
    <div class="email">
        <input type="email" name="email"
           placeholder="Email" required>
        <br><br>
    </div>

    <div class="pass">
        <input type="password" name="password"
           placeholder="Password" required>
        <br><br>
    </div>

    <div class="button">
        <br><br>
        <button type="submit">Login</button>
    </div>


</form>

<br>
<a href="/register">Create an account</a>

</body>
</html>
